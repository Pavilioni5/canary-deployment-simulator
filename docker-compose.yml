version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: canary_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-canary_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canary_password}
      POSTGRES_DB: ${POSTGRES_DB:-canary_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canary_user -d canary_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - canary_net

  # ----------------------------------------------------------------------------
  # Backend API Service (FastAPI)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: canary_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://canary_user:canary_password@db:5432/canary_db
      SECRET_KEY: ${SECRET_KEY:-canary-deployment-simulator-academic-secret-key-p71-2026}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://localhost
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - canary_net

  # ----------------------------------------------------------------------------
  # Frontend Dashboard Service (React + Vite served via Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: canary_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - canary_net

# ------------------------------------------------------------------------------
# Persistent Volumes & Bridge Networks
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: canary_postgres_data

networks:
  canary_net:
    name: canary_network
    driver: bridge
